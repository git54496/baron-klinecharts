[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baron-klinecharts"
version = "0.2.1"
description = "Deterministic ChartScene models, validation, editing, and rendering."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
dependencies = [
  "jsonschema==4.26.0",
  "playwright==1.61.0",
  "rfc8785==0.1.4",
]

[project.urls]
Source = "https://github.com/git54496/baron-klinecharts"
Issues = "https://github.com/git54496/baron-klinecharts/issues"
Changelog = "https://github.com/git54496/baron-klinecharts/releases"

[project.optional-dependencies]
dev = ["build==1.3.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
baron_kline = [
  "schemas/*.json",
  "runtime/runtime-template.html",
]

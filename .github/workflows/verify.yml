name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  full-stack:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -e 'python/baron-klinecharts[dev]'
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  node-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run generate
      - run: npm run typecheck
      - run: npm run test:unit

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e python/baron-klinecharts
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s python/baron-klinecharts/tests -p 'test_*.py'

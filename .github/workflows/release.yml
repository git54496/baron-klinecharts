name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Verify and build immutable artifacts
    runs-on: macos-15
    env:
      BARON_PNG_BASELINE: github-macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Use the npm version required by Trusted Publishing
        run: npm install --global npm@11.5.1
      - name: Install locked dependencies
        run: npm ci
      - name: Install the Python project
        run: python -m pip install -e 'python/baron-klinecharts[dev]'
      - name: Install the pinned Chromium revision
        run: npx playwright install --with-deps chromium
      - name: Verify the release tag and manifests
        run: npm run release:check-version -- --tag "${{ github.event.release.tag_name }}"
      - name: Run the complete verification suite
        run: npm run verify
      - name: Build npm release tarballs
        run: npm run release:build-npm
      - name: Build Python wheel and source distribution
        run: python -m build --wheel --sdist --outdir release-artifacts/python python/baron-klinecharts
      - name: Generate the release checksum manifest
        shell: bash
        run: |
          find release-artifacts -type f ! -name SHA256SUMS -print |
            LC_ALL=C sort |
            while IFS= read -r file; do
              shasum -a 256 "$file"
            done > release-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use the npm version required by Trusted Publishing
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Publish the verified npm tarballs in dependency order
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(
              readFileSync("release-artifacts/npm/npm-artifacts.json", "utf8"),
            );
            for (const entry of manifest.packages) {
              process.stdout.write(`${entry.filename}\n`);
            }
          ' |
            while IFS= read -r filename; do
              npm publish "release-artifacts/npm/${filename}" --access public --provenance
            done

  publish-pypi:
    name: Publish Python distributions
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-artifacts/python/

  release-assets:
    name: Attach verified distributions to GitHub Release
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Upload distributions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            release-artifacts/npm/*.tgz \
            release-artifacts/npm/npm-artifacts.json \
            release-artifacts/python/* \
            release-artifacts/SHA256SUMS
